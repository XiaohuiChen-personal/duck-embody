# Duck Embody — benchmark configuration.
#
# FROZEN BEFORE THE BATCH (design doc 06 §2). Every value here is part of the
# fairness contract: changing any of it after the freeze invalidates all prior
# trials. `duck_embody/runner.py` hashes this file into results/freeze.json.
#
# Values marked MEASURED come from a smoke test and cite it; values marked
# DESIGN come from a design doc. Nothing here is a guess (AGENTS.md rule 3).

# --- Trial matrix -----------------------------------------------------------
seeds: [101, 102, 103, 104]          # DESIGN doc 06 §2; identical for every model
models: [fable5]                     # OWNER-DIRECTED companion batch 2026-08-04:
                                     # measure Fable 5 on the v5d-r3 harness under
                                     # the same discipline as certifying L8.
                                     # Certifying L8 remains untouched:
                                     #   batch-id  v5d-r3-final-prod
                                     #   out-dir   results/raw_v5d_r3/
                                     #   matrix    [sonnet5, opus5, gpt56sol]
                                     # This file's live matrix is NOT that L8
                                     # matrix — companion batch-id will be
                                     # v5d-r3-fable5 (see results/rerun_log.md).
                                     # Prior amendment 2026-07-30 swapped
                                     # fable5 -> sonnet5 for cost; v4 freeze
                                     # still carries its fable5 column.

# --- Caps (per stage) -------------------------------------------------------
caps:
  turns: 40                          # DESIGN doc 06 §3.2
  policy_seconds: 240                # DESIGN doc 06 §3.2
  # A fall ends the whole TRIAL, not just the stage (doc 01 §8).
  #
  # PER STAGE means the budget RESETS at the find_kitchen -> return_home
  # boundary and the caps themselves do not change, so the first stage-2 request
  # renders `Budget: turns 0/40, policy-seconds 0.0/240` (doc 05 §3.3 item (2),
  # doc 06 §3.2; RESOLVED by T3.4 and now stated outright in both). A cumulative
  # line would show `turns 31/40` on the model's first return-home request —
  # an immediate false cap — and doc 06 §5.4/§5.5/§5.8 all report per stage.
  # Implemented by `tools.ToolContext.reset_for_stage()`, which zeroes exactly
  # the stage-scoped fields and deliberately NOT the trial-scoped bump counter.

# --- Protocol (the stage machine) -------------------------------------------
protocol:
  # RESOLVED by T3.4 (doc 05 §12, doc 06 §12; previously in no config at all).
  # `return_home` runs iff `find_kitchen` SUCCEEDED — so not after a cap-out, not
  # after a fall, and (the case the open question did not name) not after a
  # `declare_done` outside the 0.35 m target region either. Mirrors
  # `duck_embody.tasks.find_kitchen.STAGE2_REQUIRES_STAGE1_SUCCESS`, with an
  # agreement test in tests/test_loop.py. See that constant's docstring for the
  # measured reason: under the alternative, a wrong declare landing inside the
  # 0.5 m home disc scores return_home a success with ZERO motion, which is 25
  # percentage points of an N=4 success rate.
  stage2_requires_stage1_success: true
  # An unrun stage 2 is reported as outcome `not_run` with turns 0 and
  # policy-seconds 0.0; the return-home SR denominator stays N=4 (doc 06 §12).
  unrun_stage_outcome: not_run

# --- Context policy (doc 05 §5.2) -------------------------------------------
context:
  # System prompt + first turn + last K turns; the memory block is regenerated
  # into every request and is exempt from truncation. Images age out with the
  # window, INCLUDING the pinned first turn's spawn frame (doc 05 §12's uniform
  # rule, kept by T3.4).
  #
  # NOT per-model. doc 05 §7.1 lists "context K" as a configs/models/*.yaml key,
  # but the frozen SYSTEM_PROMPT states "the last 10 turns" to every model and
  # AGENTS.md rule 4 forbids per-model tuning — a per-model K would let one YAML
  # contradict the sentence the model is told, with nothing failing.
  # `loop.K_CONTEXT_TURNS`; tests/test_loop.py asserts all three agree.
  k_turns: 10

# --- Locomotion -------------------------------------------------------------
# !! RECALIBRATED 2026-07-29 for v5d_contact_wrench !!
# The locomotion block below is a MEASUREMENT OF THE SHIPPED POLICY, not harness
# configuration. It was re-derived with scripts/smoke_displacement.py
# --checkpoint <v5d> + scripts/derive_calibration.py, with a v4_robust control
# run reproducing every previous value to within 0.1% (see
# results/logs/derived_calibration.json).
#
# NOTE, verified: NO PYTHON READS THIS BLOCK. The single runtime consumer is
# duck_embody/sim/policy_wrapper.py::K_VELOCITY_REALISATION, which is updated in
# the same commit. Editing this file alone changes nothing at runtime — it is
# kept in step so the documentation cannot contradict the code.
locomotion:
  control_hz: 50                     # sim dt 0.005 x decimation 4
  # Training command hull. Read from policy/params/env.yaml (T0.1).
  hull:
    vx: [-0.148, 0.222]
    vy: [-0.111, 0.111]
    wz: [-0.5, 0.5]

  # MEASURED (T1.3, results/figures/smoke/displacement_report.json, seed 42):
  # net displacement / (0.2 m/s x 20 s) on the empty plane.
  # This is the number the parent repo never measured — its velocity metric is
  # an instantaneous L2 error, which cannot see a systematic shortfall.
  k_velocity_realisation: 0.9617    # v5d: 3.8470 m achieved vs 4.0 m commanded (was 1.004 = v4_robust)
  measured_speed_mps: 0.1923
  # k POLICY (pinned by PLAN T1.3; AGENTS.md rule 5 wins over doc 02 §6.2):
  # the dead-reckoning integrator uses COMMANDED velocity with NO k, so drift
  # stays honest and measurable. k is consumed ONLY by (i) time-cap/wall-clock
  # forecasting and (ii) the move() servo target (dist / k) and timeout margin.

  # DESIGN doc 05 §4 (the send_velocity schema description the model reads) and
  # doc 02 §6.3 (`d = clip(duration_s, 0.2, 3.0)`). Until T3.2 this bound lived
  # in NO code: `execute()` accepts any duration. It is now
  # `tools.DURATION_RANGE_S`, and tests/test_tools.py asserts the two agree —
  # the same treatment the caps get, for the same reason (a bound the model is
  # told about but the harness does not enforce is worse than no bound).
  send_velocity_duration_s: [0.2, 3.0]

  # MEASURED (T1.3 run b): commanded wz 0.3 rad/s -> 0.295 realised.
  turn_rate_realisation: 0.9372    # v5d: |161.09| deg over 10 s at 0.3 rad/s (was 0.982 = v4)

  # MEASURED (T1.3 runs a/d): the bare policy does NOT walk straight. Commanded
  # (0.2, 0, 0) yaws ~1.8 deg/s — 36.6 deg over 20 s / 4 m, and ~103 deg per
  # 100 s on the 120 s hold. This is consistent with the parent eval's own
  # wz tracking error (0.067 rad/s = 3.8 deg/s), i.e. a real property of the
  # policy rather than a harness bug.
  open_loop_yaw_drift_deg_per_s: 1.3475   # v5d: |-26.95| deg / 20 s (was 1.83 = v4; v5d walks straighter)

  # MEASURED (T1.3 run f): closing wz on the compass during a drive removes it —
  # 0.39 deg of drift over the same 20 s / 4 m, with k essentially unchanged
  # (1.018). THIS IS WHY move() HOLDS HEADING; see PLAN T1.3.
  heading_hold:
    enabled: true
    kp: 1.5                          # heading error (rad) -> wz, clipped to hull
    chunk_s: 0.2                     # correction interval
    residual_drift_deg_per_20s: 0.04

  # Bump detection (doc 02 §6.2). Debounced so a graze while squeezing through
  # a 0.35 m doorway is not read as a collision.
  #
  # TUNED IN T2.4. What changed was the BODIES, not the numbers. The spec said
  # trunk contact; measurement (results/figures/smoke/bump_bodies_report.json)
  # showed the duck's head leads at its own height, so the trunk registers the
  # sofa (499 N) but NEVER a wall or the fridge proxy — head_assembly takes those
  # (115 N / 40 N). Trunk-only detection was therefore blind to walls, the most
  # common obstacle here, and failed silently: drive into a wall, get told
  # bumped=false, keep pushing, topple, trial over, no collision ever reported.
  bodies: all_except_feet      # feet excluded: they read 80-200 N against the floor
  force_n: 1.0                 # unchanged; real contacts are 28-499 N, 2 orders clear
  bump:
    force_n: 1.0
    debounce_steps: 3
    # AMENDED by gap-hunt S4 (2026-07-27): move() aborts only on SUSTAINED
    # contact - 2 consecutive bumping chunks (0.4 s). A single-chunk graze is
    # reported in status.contact but does not stop the walk. Measured defect it
    # fixes: a 60 ms graze aborted a 1.0 m move at 0.347 m with 0.80 m free
    # ahead, telling the model "bumped" in open space.
    move_abort_sustained_chunks: 2
    # False-positive half, asserted rather than assumed: all 8 doorway transits
    # (4 doorways x both directions) report bumped=false.
    doorway_transits_clean: 8

  # MEASURED (gap-hunt S4 forensics, 2026-07-27): the walking gait's swept
  # half-width is ~0.11-0.15 m against the 0.08 m nominal body radius used for
  # grid inflation. At 3 cm beyond the radius the right knee scrapes a cabinet
  # run laterally (81.9 N peak, sustained); at 7 cm the contact vanishes.
  # Doorways (0.175 m to each face) clear it - consistent with T2.4's 8/8
  # transits. The ORACLE grid stays at 0.08 m (its corridors are all >= the
  # doorway margin, measured); this constant records the physical truth so a
  # future narrower layout knows the real constraint.
  swept_half_width_measured_m: [0.11, 0.15]

  # Fall termination (doc 02 §5). Nominal trunk height measured 0.170-0.176 m
  # across all T1.3 runs, so 0.09 m is unambiguous.
  fall:
    tilt_limit_deg: 60
    min_height_m: 0.09

# --- Scene (frozen by the T2.3 gate) ----------------------------------------
scene:
  # RAISED 0.5 -> 0.7 during the T2.3 gate. doc 03 §7 named this exact
  # contingency; the gate produced exactly that evidence (the judge read the
  # hallway as an "outdoor courtyard", naming it from the sofa and bed visible
  # OVER the 0.5 m walls).
  wall_height_m: 0.7
  # ADDED by the gate. Without a ceiling the judge called every room an
  # "outdoor terrace/rooftop" — and the question is literally "what room OF A
  # HOME is this?". Sealing the rooms also makes them dark, so per-room lights
  # arrive with it.
  ceiling: true
  room_lights: true
  # The gate itself: 4 rooms x 5 poses x 4 bearings, judged per pose from the
  # whole sweep (what look_around gives a contestant), majority over poses,
  # repeated 3x with EVERY run required to pass. 5 poses rather than 3 because
  # the judge cannot be pinned to a temperature and 3 samples produced a
  # majority that flipped between runs on identical frames.
  survey_poses_per_room: 5
  survey_bearings_deg: [0, 90, 180, 270]
  gate_repeats_required: 3

  # MOVED BY T2.4: armchair 0.95 -> 0.72. Its inflated footprint left ~7 cm of
  # free centre-line in the living-room/kitchen doorway, so the SPL ORACLE would
  # have routed through a gap the robot cannot reliably walk while any model that
  # sensibly detoured got scored against it. A fairness bug, not a driving one —
  # and invisible to both existing tests (it was 0.40 m from the doorway centre,
  # and A* still found a route). tests/test_layout.py now asserts the full
  # +/-0.5 m centre-line through every doorway is clear.
  # Scene re-rendered and the recognition gate RE-RUN: 4/4 rooms, 3/3 repeats.
  armchair_pos: [1.40, 0.72]

  # Rule-11 audit camera (apartment only; the empty-plane cfg keeps its own).
  # 1.4 m up / 0.85 m back, looking down: high enough to clear the 0.7 m walls,
  # close enough that contact is judgeable. Requires the ceiling to be hidden for
  # the grab (Recorder(hide_ceiling=True)) — it is above the roofline.
  audit_viewer_eye: [0.6, 0.6, 1.4]
  audit_viewer_lookat: [0.0, 0.0, 0.15]

# --- Scoring ----------------------------------------------------------------
scoring:
  # True base XY sampling rate for the SPL path integral (doc 06 §5.3).
  pose_trace_hz: 5
  find_kitchen_success_radius_m: 0.35
  return_home_success_radius_m: 0.5
  # The stage-1 success region, named and versioned (TR.2). ONE predicate now
  # serves the live stage machine and the published scorer:
  # `duck_embody.tasks.find_kitchen.SUCCESS_CRITERION`, mirrored here so the
  # criterion sits inside the hashed fairness contract, with an agreement test
  # in tests/test_loop.py. Definition: docs/METRICS.md §2.1 — inside the 0.35 m
  # point disc OR within 0.35 m of any of the five kitchen counter footprints
  # while standing in the kitchen. `return_home` keeps the 0.5 m spawn disc.
  #
  # Before TR.2 this value existed in NO config and in only ONE consumer: v2
  # was implemented post-hoc in scoring.py while the live gate stayed on the
  # point disc, so the published benchmark and the running task were different
  # tasks (forensics F-02). `opus5_seed101` was published a success and never
  # offered its return leg. Every new trial JSON stamps this string into
  # `config.success_criterion`; logs without the field are legacy point-disc
  # runs and are still scored as such.
  success_criterion: v2_any_counter
  bootstrap_resamples: 10000
  bootstrap_seed: 20260726

# --- Runtime forecast -------------------------------------------------------
# MEASURED (T1.3): 210 policy-seconds simulated in ~363 s wall-clock WITH 25 fps
# video recording => ~1.73 s wall per policy-second. Tightens doc 06 §8, whose
# sim-stepping term was previously unmeasured. Per-turn API latency is still
# unmeasured and lands here at T3.5.
runtime:
  wall_s_per_policy_s_with_recording: 1.73
  measured_at: T1.3
  # MEASURED per-turn wall-clock (API + sim + render), T3.5 live runs
  # (2026-07-27), from consecutive turn timestamps in the trial JSONs:
  #   fable5   sanity runs: median 12-18 s, p90 16-31 s, max 36 s;
  #            a thinking-heavy opening turn measured 33 s
  #   gpt56sol dry run:     median 24 s, max 63 s (n=4)
  # Batch forecast at these numbers: central ~42 turns/trial x 12 trials
  # x ~20 s median = ~2.8 h sequential; worst case (every stage to the
  # 40-turn cap) x p90 ~ 8 h. Supersedes doc 06 §8's unmeasured 5-25 s/turn
  # band - the median lands inside it.
  per_turn_wall_s:
    fable5_median_range: [12, 18]
    fable5_max: 36
    gpt56sol_median: 24
    gpt56sol_max: 63
  batch_forecast_h: {central: 2.8, worst_case: 8.0}

# --- Camera (frozen; MEASURED by T1.4) --------------------------------------
camera:
  resolution: [512, 512]
  hfov_deg: 90
  focal_length: 12.0
  horizontal_aperture: 24.0          # aperture = 2 x focal => exactly 90 deg
  jpeg_quality: 85
  jpeg_bytes_typical: 15920          # MEASURED on an empty-plane frame

  # Mount "rung 1b: slaved" — the camera is a SIBLING of the robot and its world
  # pose is written from the robot's true pose before every capture via
  # set_world_poses_from_view(eye, target). Doc 04 §3's rung 1 (parented under
  # /Robot/base with an OffsetCfg) was implemented and MEASURED to fail: it
  # filmed the sky, and its pose readback reported a level forward-facing camera
  # while doing so. Aiming by eye/target has no orientation convention at all.
  mount: slaved_eye_target
  mount_forward_m: 0.12              # MUST clear the head shell — see below
  mount_left_m: 0.0
  mount_up_m: 0.19
  measured_height_m: 0.3644          # MEASURED (trunk measured at 0.1744 m)

  # At forward offsets <= 0.06 m the lens is INSIDE the duck's own head and
  # films its interior: a plausible-looking uniform light gray (the duck is
  # white) that passes any naive "not black, not flat" check while showing the
  # model nothing. Measured sweep (scripts/debug_camera_offset.py), horizon
  # delta = |top-half mean - bottom-half mean|:
  #   0.02 -> 2.2   0.06 -> 3.7   0.10 -> 95.2   0.14 -> 96.0
  # The smoke test now asserts horizon delta > 30 and frame std > 30.
  horizon_delta_measured: 96.2

  # Warmup renders before a frame is fit to send to a model. MEASURED N=1 on the
  # EMPTY PLANE (zero gray frames over a 25-frame walking clip), but that scene
  # has almost no MDL to stream. T2.3 re-measures against the furnished
  # apartment and freezes the value there; 5 is the conservative default until
  # then (5 renders cost milliseconds; one gray first observation poisons a
  # trial's opening room guess).
  # RE-MEASURED against the FURNISHED apartment (T2.3) — the scene doc 04 §5.2
  # actually cared about, with SimReady/ArchVis materials to stream. Still 1:
  # frame 1 after a reset was fully shaded, and 80 survey frames produced ZERO
  # gray frames. Kept at 5 anyway: 5 renders cost milliseconds, and one gray
  # first observation poisons a trial's opening room guess.
  warmup_renders: 5
  warmup_measured_empty_plane: 1
  warmup_measured_furnished: 1
  warmup_gray_frames_in_80_survey_frames: 0

  look_around_bearings_deg: [0, 90, 180, 270]
