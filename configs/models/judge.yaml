# NOT a benchmark contestant. The out-of-benchmark judge for T2.3's scene
# survey gate.
#
# WHY a fourth model: doc 04 §8 requires the room-recognition gate to be judged
# by "a VLM that is not one of the three benchmark models ... to avoid tuning
# the scene to any contestant's strengths". T2.3 iterates the layout until the
# probe passes, so using a contestant would tune the world to that contestant —
# a benchmark-integrity defect. The judge is named in the methods write-up.
provider: anthropic
# MOVED 2026-07-30 (claude-sonnet-5 -> claude-sonnet-4-6). The matrix swap that
# day made claude-sonnet-5 a CONTESTANT (configs/models/sonnet5.yaml), which
# would have put the judge and a contestant on the same model and broken the
# §8 property above. The guard that should have caught this passed vacuously
# because it hardcoded the retired contestant set; it now reads the live matrix.
#
# The HISTORICAL gate result stands: the T2.3 survey ran under claude-sonnet-5
# on 2026-07-2x, when that model was not a contestant, so it satisfied §8 as it
# stood at the time. Any RE-RUN of the survey uses claude-sonnet-4-6, and the
# methods write-up names both with their dates. Sonnet 4.6 is a full VLM and
# the task is a one-word room question, so capability is not the binding
# constraint here — non-collision is.
model_id: claude-sonnet-4-6

# One-word room answers; no tool use, no thinking budget needed.
max_tokens: 64

# $3/$15 standard; an introductory $2/$10 per MTok runs through 2026-08-31, so
# the recorded cost is an upper bound.
price_in_per_mtok: 3.0
price_out_per_mtok: 15.0
price_cache_read_per_mtok: 0.3
price_cache_write_per_mtok: 3.75
pricing_version: "2026-08-02"
pricing_source: "https://platform.claude.com/docs/en/about-claude/pricing"

params: {}

notes: >
  Used only by scripts/render_scene_survey.py, offline, after the kit process
  exits. Its spend is reported separately from the benchmark batch and never
  pooled with contestant results.
