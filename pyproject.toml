[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-embody"
version = "0.1.0"
description = "LLM-as-SLAM: language models navigate a bipedal robot through an unknown apartment in Isaac Sim"
requires-python = ">=3.11"
# NOTE: Isaac Sim / Isaac Lab / torch come from the Isaac kit python environment
# (see AGENTS.md "Runtime environment"), NOT from this dependency list.
dependencies = [
  "anthropic",
  "openai",
  "python-dotenv",
  "pyyaml",
  # numpy is PINNED <2: the kit python ships numpy 1.26.0 and Isaac Sim 5.1.0's
  # compiled extensions are built against the 1.x ABI. An unpinned requirement
  # lets pip pull numpy 2.x on any future resolve and silently breaks the sim.
  "numpy<2",
  "pillow",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

# Explicit package discovery. Without this, setuptools' flat-layout autodiscovery
# sees assets/ policy/ results/ configs/ alongside duck_embody/ and refuses to
# build ("Multiple top-level packages discovered in a flat-layout") — which made
# the plain `pip install -e .` in PLAN T0.0 fail. Verified 2026-07-26.
[tool.setuptools.packages.find]
include = ["duck_embody*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.duck-embody]
# Parent robot repo (read-only dependency) pinned commit — AGENTS.md §4 / rule 8.
# Only duck_embody/env/embody_env_cfg.py may import from it.
parent_repo = "https://github.com/XiaohuiChen-personal/Open_Duck_Mini_Jetson"
parent_repo_path = "~/Projects/Open_Duck_Mini_Jetson"
parent_repo_branch = "v2"
parent_repo_commit = "34f70fda182120369f954a4b1ccfa1edf58190ea"
# Recorded 2026-07-26 (T0.1). embody_env_cfg.py asserts this at import and warns
# on mismatch. The vendored policy in policy/ was produced at this commit.
